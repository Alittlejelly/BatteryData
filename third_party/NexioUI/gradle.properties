# NexioUI - Gradle 全局构建参数
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
kotlin.code.style=official
android.useAndroidX=true

# 本机默认 JDK 不是 17+ 时，取消注释并指向自己的 JDK：
# org.gradle.java.installations.paths=/path/to/jdk

# 本工程只用 Android 目标：关掉 iOS，免得配置阶段去拉 Kotlin/Native 工具链
nexioui.ios=false
